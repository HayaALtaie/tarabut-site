<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="assets/images/favicon.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/hero.css" />
    <link rel="stylesheet" href="css/components/about-section.css" />
    <link rel="stylesheet" href="css/components/footer.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <title data-i18n="page_title_news">ترابط - الأخبار</title>
    <style>
        .coming-soon-wrapper {
            padding: 100px 0;
            text-align: center;
        }

        .coming-soon-text {
            font-size: var(--font-5xl);
            color: var(--dark-blue);
            font-weight: var(--font-bold);
        }
    </style>
</head>

<body>

    <button id="lang-toggle" class="lang-btn" data-i18n="lang_btn">🇺🇸 English</button>

    <header class="site-header">
        <div class="header-inner">
            <div class="logo-area">
                <div class="logo-shape">
                    <img src="assets/images/logo-tarabut.png" alt="Tarabut Logo" />
                </div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="main-nav" id="main-nav">
                <ul>
                    <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
                    <li><a href="about-us.html" data-i18n="nav_about">من نحن</a></li>
                    <li><a href="services.html" data-i18n="nav_services">الخدمات</a></li>
                    <li><a href="news.html" class="active" data-i18n="nav_news">الاخبار</a></li>
                    <li><a href="clients.html" data-i18n="nav_clients">عملائنا</a></li>

                    <li><a href="contact.html" data-i18n="nav_contact">تواصل معنا</a></li>
                </ul>
            </nav>

            <div class="top-bar">
                <div class="contact-info">
                    <span data-i18n="contact_number">07834434800</span>
                    <div class="phone-icon-circle">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="hero page-hero news-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content container">
            <div class="page-title-box">
                <h1 class="page-title" data-i18n="nav_news">الاخبار</h1>
                <div class="breadcrumbs">
                    <a href="index.html" data-i18n="nav_home">الرئيسية</a>
                    <i class="fas fa-arrow-left"></i>
                    <span data-i18n="nav_news">الاخبار</span>
                </div>
            </div>
        </div>
    </section>

    <section class="coming-soon-wrapper">
        <div class="container">
            <h2 class="coming-soon-text" data-i18n="coming_soon">قريباً...</h2>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-bottom">
            <div class="container footer-bottom-content">
                <div class="footer-logo">
                    <img src="assets/images/logo-tarabut.png" alt="Tarabut Logo">
                    <div class="logo-text">
                        <span>ترابط</span>
                        <span>Tarabut</span>
                    </div>
                </div>

                <nav class="footer-nav">
                    <ul>
                        <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
                        <li><a href="about-us.html" data-i18n="nav_about">من نحن</a></li>
                        <li><a href="clients.html" data-i18n="nav_clients">عملائنا</a></li>
                        <li><a href="index.html#contact" data-i18n="nav_contact">تواصل معنا</a></li>
                    </ul>
                </nav>
            </div>
            <div class="footer-copyright">
                <p data-i18n="footer_copy">Copyright 2025 Tarabut. All Rights Reserved</p>
            </div>
        </div>

        <button id="backToTop" class="back-to-top">
            <i class="fas fa-chevron-up"></i>
        </button>
    </footer>

    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
